[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/alchemaxinc/oapi-codegen-rust"
license = "MIT"

[workspace.lints.clippy]
implicit_return = "deny"
needless_return = "allow"
default_numeric_fallback = "deny"
unreadable_literal = "deny"
unseparated_literal_suffix = "deny"
allow_attributes_without_reason = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
else_if_without_else = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
map_err_ignore = "deny"
