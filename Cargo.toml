[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/alchemaxinc/oapi-codegen-rust"
license = "MIT"

# Untrusted OpenAPI specs drive arithmetic (e.g. schema/$ref counting and
# indexing during lowering). Keeping overflow checks on in release builds
# turns silent wraparound into a clean panic instead of corrupt generated
# code, at a small, acceptable perf cost for a CLI generator.
[profile.release]
overflow-checks = true

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
as_conversions = "deny"
dbg_macro = "deny"
default_numeric_fallback = "deny"
else_if_without_else = "deny"
expect_used = "deny"
get_unwrap = "deny"
implicit_return = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
map_err_ignore = "deny"
needless_return = "allow"
print_stderr = "deny"
print_stdout = "deny"
rest_pat_in_fully_bound_structs = "deny"
todo = "deny"
unreadable_literal = "deny"
unseparated_literal_suffix = "deny"
unwrap_used = "deny"
