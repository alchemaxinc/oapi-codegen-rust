openapi: 3.0.3
info:
  title: Client form response
  version: 1.0.0
paths:
  /form:
    get:
      operationId: getForm
      responses:
        "200":
          description: A form-encoded body.
          content:
            application/x-www-form-urlencoded:
              schema:
                $ref: "#/components/schemas/Form"
components:
  schemas:
    Form:
      type: object
      required:
        - name
      properties:
        name:
          type: string
