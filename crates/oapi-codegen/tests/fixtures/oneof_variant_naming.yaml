openapi: "3.0.3"
info:
  title: how an inline oneOf member gets its name
  version: "1.0.0"
paths: {}
components:
  schemas:
    # A member that hoists no type takes the name of the type it holds. These
    # names keep their meaning when the member list changes order.
    Scalars:
      oneOf:
        - type: string
        - type: integer
          format: int32
        - type: integer
        - type: number
        - type: boolean
    # A `format` gives a type of its own, and that type gives the name.
    Formats:
      oneOf:
        - type: string
          format: date
        - type: string
          format: date-time
        - type: string
          format: uuid
    # A member that hoists a type has no name to take, so it gives one.
    # `x-rust-name` names the variant and the hoisted type alike.
    Named:
      oneOf:
        - x-rust-name: Cat
          type: object
          required: [meow]
          properties:
            meow:
              type: string
        - x-rust-name: Dog
          type: object
          required: [bark]
          properties:
            bark:
              type: string
    Widget:
      type: object
      required: [sku]
      properties:
        sku:
          type: string
    # A `$ref` member takes the name of the type it points at. A list hoists no
    # struct of its own, but it still holds no name, so it gives one.
    Referenced:
      oneOf:
        - $ref: "#/components/schemas/Widget"
        - x-rust-name: Tally
          type: array
          items:
            type: string
    # A member list that mixes every rule above.
    Mixed:
      oneOf:
        - type: string
        - $ref: "#/components/schemas/Widget"
        - x-rust-name: Detail
          type: object
          required: [note]
          properties:
            note:
              type: string
