openapi: "3.0.3"
info:
  title: Array types
  version: "1.0.0"
paths: {}
components:
  schemas:
    Tag:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Arrays:
      type: object
      required: [scalars, refs, matrix]
      properties:
        scalars:
          type: array
          items:
            type: string
        refs:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        matrix:
          type: array
          items:
            type: array
            items:
              type: integer
