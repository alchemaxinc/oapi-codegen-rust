openapi: 3.0.3
info:
  title: unsupported cross-file schema ref (component missing)
  version: "1"
paths:
  /parcels:
    post:
      operationId: acceptParcel
      summary: Accept a parcel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # `compose_shared.yaml` declares no `Crate`. The name once reached
              # the output through the `import-mapping`, and the composed crate
              # then named a type the models run never wrote.
              $ref: "compose_shared.yaml#/components/schemas/Crate"
      responses:
        "201":
          description: The parcel was accepted.
