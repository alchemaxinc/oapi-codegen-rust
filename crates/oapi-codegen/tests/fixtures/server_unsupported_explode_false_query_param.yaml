openapi: 3.0.3
info:
  title: Unsupported non-default array query encoding
  version: 1.0.0
paths:
  /search:
    get:
      operationId: search
      summary: Reject an array query parameter with explode false.
      parameters:
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Results.
