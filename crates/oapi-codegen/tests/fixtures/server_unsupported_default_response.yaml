openapi: 3.0.3
info:
  title: Default-response server
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets.
      responses:
        "200":
          description: The full list of pets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: An unexpected error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Pet:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
