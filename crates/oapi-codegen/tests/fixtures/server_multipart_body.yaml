openapi: 3.0.3
info:
  title: multipart body
  version: "1"
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "204":
          description: The file was stored.
components:
  schemas:
    UploadRequest:
      type: object
      required: [file, description, attempts]
      properties:
        file:
          type: string
          format: binary
        description:
          type: string
        note:
          type: string
        attempts:
          type: integer
          format: int64
        priority:
          $ref: "#/components/schemas/Priority"
    Priority:
      type: string
      description: A same-document scalar `$ref` field, resolved to `String`.
