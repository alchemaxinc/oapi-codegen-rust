openapi: "3.0.3"
info:
  title: allOf composition
  version: "1.0.0"
paths: {}
components:
  schemas:
    Base:
      type: object
      required: [id]
      properties:
        id:
          type: string
    Timestamped:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
    Entity:
      allOf:
        - $ref: "#/components/schemas/Base"
        - $ref: "#/components/schemas/Timestamped"
        - type: object
          required: [name]
          properties:
            name:
              type: string
    Count:
      type: integer
      minimum: 1
      maximum: 20
      multipleOf: 2
      nullable: true
    Intersection:
      allOf:
        - &wide
          type: object
          additionalProperties: false
          required: [count]
          properties:
            count:
              $ref: "#/components/schemas/Count"
            label:
              type: string
              pattern: ^[a-z]+$
              minLength: 2
              maxLength: 8
            color:
              type: string
              enum: [red, green, blue]
        - &narrow
          allOf:
            - type: object
              additionalProperties: false
              required: [label, color]
              properties:
                count:
                  type: integer
                  minimum: 3
                  maximum: 10
                  exclusiveMaximum: true
                label:
                  type: string
                  minLength: 3
                  maxLength: 6
                color:
                  type: string
                  enum: [green, blue]
    Reversed:
      allOf: [*narrow, *wide]
    Inline:
      type: object
      required: [value]
      properties:
        value:
          allOf: [*wide, *narrow]
    IdenticalComposites:
      allOf:
        - type: object
          required: [value]
          properties:
            value: &composed
              allOf: [*wide, *narrow]
        - type: object
          properties:
            value: *composed
    SingleClosed:
      type: object
      required: [value]
      properties:
        value:
          allOf:
            - type: object
              additionalProperties: false
              properties:
                flag:
                  type: boolean
    NullableIntersection:
      allOf:
        - type: object
          required: [ratio]
          properties:
            ratio:
              type: number
              nullable: true
              minimum: 1.5
              maximum: 5.5
              multipleOf: 0.5
        - type: object
          properties:
            ratio:
              type: number
              nullable: true
              minimum: 2.5
              exclusiveMinimum: true
              maximum: 4.5
    EnumIntersection:
      allOf:
        - &enum_wide
          type: object
          required: [label, count]
          properties:
            label:
              type: string
              enum: [a_b, a-b, other]
            count:
              type: integer
              format: int32
              enum: [3, 2, 1]
        - &enum_narrow
          type: object
          properties:
            label:
              type: string
              enum: [a-b, a_b]
            count:
              type: integer
              format: int32
              enum: [2, 3]
    EnumReversed:
      allOf: [*enum_narrow, *enum_wide]
    CompositeAlias:
      $ref: "#/components/schemas/Intersection"
    CompositeChain:
      $ref: "#/components/schemas/CompositeAlias"
    AliasedComposites:
      allOf:
        - &composite_direct
          type: object
          required: [value]
          properties:
            value:
              $ref: "#/components/schemas/Intersection"
        - &composite_alias
          type: object
          properties:
            value:
              $ref: "#/components/schemas/CompositeChain"
    AliasedCompositesReversed:
      allOf: [*composite_alias, *composite_direct]
    InlineRefComposites:
      allOf:
        - type: object
          required: [value]
          properties:
            value: *composed
        - *composite_alias
    WrapperA: &composite_wrapper
      allOf:
        - $ref: "#/components/schemas/Intersection"
    WrapperB: *composite_wrapper
    WrapperChain:
      $ref: "#/components/schemas/WrapperB"
    WrappedComposites:
      allOf:
        - &wrapper_a
          type: object
          required: [value]
          properties:
            value:
              $ref: "#/components/schemas/WrapperA"
        - &wrapper_b
          type: object
          properties:
            value:
              $ref: "#/components/schemas/WrapperChain"
        - *composite_direct
    WrappedCompositesReversed:
      allOf: [*wrapper_b, *wrapper_a, *composite_direct]
    ObjectMap:
      allOf:
        - &object_map
          type: object
          additionalProperties:
            type: object
            required: [label]
            properties:
              label:
                type: string
    EnumMap:
      allOf:
        - &enum_map
          type: object
          additionalProperties:
            type: string
            enum: [red, blue]
    NestedMap:
      allOf:
        - type: object
          additionalProperties:
            allOf: [*object_map]
    ReferencedMap:
      allOf:
        - type: object
          additionalProperties:
            $ref: "#/components/schemas/Base"
    StringMap:
      allOf:
        - &string_map
          type: object
          additionalProperties:
            type: string
    AnyMap:
      allOf:
        - &any_map
          type: object
    ExplicitAnyMap:
      allOf:
        - type: object
          additionalProperties: true
    NullableMap:
      nullable: true
      allOf:
        - *string_map
    EmptyClosed:
      allOf:
        - &empty_closed
          type: object
          additionalProperties: false
    ClosedTarget: *empty_closed
    ClosedAlias:
      allOf:
        - $ref: "#/components/schemas/ClosedTarget"
    InlineMaps:
      type: object
      required: [typed, arbitrary, nullable, closed, named]
      properties:
        typed:
          allOf: [*string_map]
        arbitrary:
          allOf: [*any_map]
        nullable:
          nullable: true
          allOf: [*string_map]
        closed:
          allOf: [*empty_closed]
        named:
          $ref: "#/components/schemas/StringMap"
        optional:
          allOf: [*string_map]
        objects:
          allOf: [*object_map]
        enums:
          allOf: [*enum_map]
        nested:
          type: object
          required: [value]
          properties:
            value:
              allOf: [*string_map]
