openapi: 3.0.3
info:
  title: form body
  version: "1"
paths:
  /login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: The issued session, form-encoded.
          content:
            application/x-www-form-urlencoded:
              schema:
                $ref: "#/components/schemas/Session"
components:
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    Session:
      type: object
      required: [token]
      properties:
        token:
          type: string
