openapi: 3.0.3
info:
  title: Ref-parameter server
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      summary: Fetch a single pet by id.
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: The requested pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Pet:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
