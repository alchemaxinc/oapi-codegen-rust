# A package manifest that opts into one workspace dependency (`serde`) but not
# the other (`axum`), which is only defined in `[workspace.dependencies]`.
[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
serde.workspace = true

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
