openapi: "3.0.3"
info:
  title: Value constraints
  version: "1.0.0"
paths: {}
components:
  schemas:
    # Each keyword below becomes a check that runs when serde reads the field.
    # A `Serialize`-only model gets no check, because the code that builds it
    # owns the value.
    Account:
      type: object
      required:
        - code
        - name
        - age
        - ratio
        - tags
        - labels
        - amount
        - readings
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}[0-9]$"
        name:
          type: string
          minLength: 1
          maxLength: 40
        age:
          type: integer
          minimum: 0
          maximum: 130
          multipleOf: 1
        ratio:
          type: number
          minimum: 0
          maximum: 1
          exclusiveMinimum: true
          exclusiveMaximum: true
        tags:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
        # A float step needs room to move: `0.3 / 0.1` does not land on a whole
        # number.
        amount:
          type: number
          multipleOf: 0.1
        # A list of floats has no `Eq`, so this one compares each pair.
        readings:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            type: number
        labels:
          type: object
          minProperties: 1
          maxProperties: 4
          additionalProperties:
            type: string
        # An optional field keeps its checks, and still reads as absent.
        note:
          type: string
          maxLength: 10
        # A `$ref` makes an alias, and an alias carries no serde attribute. So
        # the field takes the checks the target declares.
        email:
          $ref: "#/components/schemas/Email"
    Email:
      type: string
      maxLength: 60
      minLength: 3
