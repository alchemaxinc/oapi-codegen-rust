name: Check crates.io Credentials

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  check-token:
    name: Probe crates.io token
    runs-on: ubuntu-latest
    env:
      ISSUE_TITLE: "crates.io release credentials are broken or expired"
    steps:
      - name: Probe crates.io token
        id: probe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is empty or unset."
            {
              echo "state=broken"
              echo "reason=The CARGO_REGISTRY_TOKEN repository secret is empty or unset."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # /api/v1/me and /api/v1/me/tokens require cookie/session auth, so
          # every API token gets 403 there regardless of validity. Probe
          # GET /api/v1/me/tokens/{id} instead: it accepts token auth, and its
          # scope check (unset -> legacy-only) makes any modern scoped token
          # fail with "this token does not have the required permissions",
          # never "authentication failed" - that message only appears when
          # the token itself is invalid/revoked/expired.
          response=$(curl -sS -w '\n%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 \
            -H "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            -H 'User-Agent: oapi-codegen crates.io credential check (github.com/alchemaxinc/oapi-codegen-rust)' \
            "https://crates.io/api/v1/me/tokens/0")

          status="${response##*$'\n'}"
          body="${response%$'\n'*}"

          echo "crates.io tokens/0 probe returned HTTP ${status}."

          case "${status}" in
            200 | 404)
              echo "state=ok" >> "$GITHUB_OUTPUT"
              ;;
            403)
              if echo "${body}" | grep -qi 'authentication failed'; then
                {
                  echo "state=broken"
                  echo "reason=crates.io rejected CARGO_REGISTRY_TOKEN as invalid, revoked, or expired (HTTP 403: authentication failed)."
                } >> "$GITHUB_OUTPUT"
              else
                echo "crates.io rejected the probe for scope reasons, not a bad credential: ${body}"
                echo "state=ok" >> "$GITHUB_OUTPUT"
              fi
              ;;
            401)
              {
                echo "state=broken"
                echo "reason=crates.io rejected CARGO_REGISTRY_TOKEN with HTTP 401 when probing the tokens endpoint."
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Inconclusive crates.io probe (HTTP ${status}); leaving credentials unflagged."
              echo "state=inconclusive" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check configured token expiry
        id: expiry
        env:
          EXPIRES_AT: ${{ vars.CARGO_REGISTRY_TOKEN_EXPIRES_AT }}
        run: |
          set -uo pipefail

          if [ -z "${EXPIRES_AT}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN_EXPIRES_AT repository variable is not set; skipping proactive expiry warning."
            echo "state=unset" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expires_epoch=$(date -u -d "${EXPIRES_AT}" +%s 2>/dev/null) || {
            echo "::warning::CARGO_REGISTRY_TOKEN_EXPIRES_AT (\"${EXPIRES_AT}\") is not a valid YYYY-MM-DD date; skipping proactive expiry warning."
            echo "state=invalid" >> "$GITHUB_OUTPUT"
            exit 0
          }
          now_epoch=$(date -u +%s)
          days_left=$(( (expires_epoch - now_epoch) / 86400 ))

          echo "CARGO_REGISTRY_TOKEN_EXPIRES_AT=${EXPIRES_AT}, ${days_left} day(s) left."

          if [ "${days_left}" -lt 0 ]; then
            {
              echo "state=warning"
              echo "reason=CARGO_REGISTRY_TOKEN_EXPIRES_AT (${EXPIRES_AT}) is in the past; the token has likely already expired on crates.io."
            } >> "$GITHUB_OUTPUT"
          elif [ "${days_left}" -le 14 ]; then
            {
              echo "state=warning"
              echo "reason=CARGO_REGISTRY_TOKEN is set to expire on ${EXPIRES_AT} (in ${days_left} day(s)). Rotate it on crates.io before then and update both the CARGO_REGISTRY_TOKEN secret and the CARGO_REGISTRY_TOKEN_EXPIRES_AT variable."
            } >> "$GITHUB_OUTPUT"
          else
            echo "state=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Create temporary GitHub App Token
        id: app
        if: steps.probe.outputs.state == 'broken' || steps.expiry.outputs.state == 'warning'
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Open or update tracking issue
        if: steps.probe.outputs.state == 'broken' || steps.expiry.outputs.state == 'warning'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REASON: ${{ steps.probe.outputs.state == 'broken' && steps.probe.outputs.reason || steps.expiry.outputs.reason }}
          REPO: ${{ github.repository }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          The scheduled crates.io credential check failed.

          **Reason:** ${REASON}

          The release pipeline (\`.github/workflows/deploy.yml\`) publishes to
          crates.io using the \`CARGO_REGISTRY_TOKEN\` secret. It looks broken,
          expired, or close to expiring, so a release to \`main\` may fail at
          \`cargo publish\`.

          **To fix:** generate a fresh token on crates.io and update the
          \`CARGO_REGISTRY_TOKEN\` repository secret (and the
          \`CARGO_REGISTRY_TOKEN_EXPIRES_AT\` repository variable, if used).

          _Filed automatically by the [Check crates.io Credentials](${WORKFLOW_URL}) workflow run._
          EOF
          )"

          existing="$(gh issue list --repo "${REPO}" --state open \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            echo "Tracking issue #${existing} already open; adding a comment."
            gh issue comment "${existing}" --repo "${REPO}" --body "${body}"
          else
            echo "Opening a new tracking issue."
            gh issue create --repo "${REPO}" \
              --title "${ISSUE_TITLE}" --body "${body}" \
              --label bug --type Bug
          fi

      - name: Fail the run when the token is broken
        if: steps.probe.outputs.state == 'broken'
        env:
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          echo "::error::${REASON}"
          exit 1
