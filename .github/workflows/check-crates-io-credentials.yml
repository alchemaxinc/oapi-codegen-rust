name: Check crates.io Credentials

# The release pipeline (.github/workflows/deploy.yml) publishes to crates.io via
# the CARGO_REGISTRY_TOKEN secret. That token can be revoked or hit its expiry
# date silently, and today we would only discover it when a release to `main`
# fails at the very last `cargo publish` step. This scheduled job probes the
# token against the crates.io API ahead of time and opens a tracking issue so
# the credentials can be rotated *before* they break a release.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  check-token:
    name: Probe crates.io token
    runs-on: ubuntu-latest
    env:
      # Stable title so repeated runs dedupe against a single tracking issue
      # (comment on the open one) instead of filing a fresh issue each week.
      ISSUE_TITLE: "crates.io release credentials are broken or expired"
    steps:
      - name: Probe crates.io token
        id: probe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is empty or unset."
            {
              echo "state=broken"
              echo "reason=The CARGO_REGISTRY_TOKEN repository secret is empty or unset."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # crates.io returns the authenticated user for a valid token and 401/403
          # for a revoked or expired one. `/api/v1/me` needs nothing beyond a
          # readable token, so it validates the credential without mutating
          # anything. --retry (with --retry-all-errors) rides out transient
          # network / 5xx blips so a flaky run does not masquerade as a bad token.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 \
            -H "Authorization: ${CARGO_REGISTRY_TOKEN}" \
            -H 'User-Agent: oapi-codegen crates.io credential check (github.com/alchemaxinc/oapi-codegen-rust)' \
            "https://crates.io/api/v1/me")

          echo "crates.io /api/v1/me returned HTTP ${status}."

          case "${status}" in
            200)
              echo "state=ok" >> "$GITHUB_OUTPUT"
              ;;
            401 | 403)
              {
                echo "state=broken"
                echo "reason=crates.io rejected CARGO_REGISTRY_TOKEN with HTTP ${status} when probing /api/v1/me."
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Anything else (000 connection failure, 5xx, rate limiting) is not
              # a definitive credential failure, so warn but do not file noise.
              echo "::warning::Inconclusive crates.io probe (HTTP ${status}); leaving credentials unflagged."
              echo "state=inconclusive" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Create temporary GitHub App Token
        id: app
        if: steps.probe.outputs.state == 'broken'
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Open or update tracking issue
        if: steps.probe.outputs.state == 'broken'
        env:
          # Use the housekeeping bot's App token so the tracking issue is filed
          # by the bot identity rather than the generic github-actions user.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REASON: ${{ steps.probe.outputs.reason }}
          REPO: ${{ github.repository }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          The scheduled crates.io credential check failed.

          **Reason:** ${REASON}

          The release pipeline (\`.github/workflows/deploy.yml\`) publishes to
          crates.io using the \`CARGO_REGISTRY_TOKEN\` secret. It looks broken or
          expired, so the next release to \`main\` will fail at \`cargo publish\`.

          **To fix:** generate a fresh token on crates.io and update the
          \`CARGO_REGISTRY_TOKEN\` repository secret.

          _Filed automatically by the [Check crates.io Credentials](${WORKFLOW_URL}) workflow run._
          EOF
          )"

          existing="$(gh issue list --repo "${REPO}" --state open \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            echo "Tracking issue #${existing} already open; adding a comment."
            gh issue comment "${existing}" --repo "${REPO}" --body "${body}"
          else
            echo "Opening a new tracking issue."
            gh issue create --repo "${REPO}" \
              --title "${ISSUE_TITLE}" --body "${body}" \
              --label bug --type Bug
          fi

      - name: Fail the run when the token is broken
        if: steps.probe.outputs.state == 'broken'
        env:
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          echo "::error::${REASON}"
          exit 1
