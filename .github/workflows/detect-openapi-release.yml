name: Detect OpenAPI Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month

permissions:
  contents: read

env:
  UPSTREAM: OAI/OpenAPI-Specification
  MANIFEST: .github/openapi-versions.json
  ISSUE_TEMPLATE: .github/openapi-issue-template.md
  ISSUE_LABEL: openapi-version

jobs:
  detect-openapi-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Checkout and setup
        uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
        with:
          token: ${{ steps.app.outputs.token }}
          ref: develop

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Find untracked OpenAPI versions
        id: find
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          tracked="$(jq -r '.versions[].version | split(".")[:2] | join(".")' "$MANIFEST" | sort -u)"
          latest="$(gh release list --repo "$UPSTREAM" --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"

          declare -A newest
          while read -r version; do
            [ -z "$version" ] && continue
            newest["${version%.*}"]="$version"
          done <<< "$latest"

          new=""
          for line in "${!newest[@]}"; do
            grep -qxF "$line" <<< "$tracked" || new+="${newest[$line]} "
          done
          echo "versions=$(echo $new)" >> "$GITHUB_OUTPUT"

      - name: Open tracking issues
        id: issues
        if: steps.find.outputs.versions != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSIONS: ${{ steps.find.outputs.versions }}
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --color 5319e7 \
            --description "Tracks support for a new OpenAPI Specification version" 2>/dev/null || true

          summary="Newly detected OpenAPI Specification versions:"$'\n'
          for version in $VERSIONS; do
            title="Support OpenAPI v$version"
            number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ISSUE_LABEL" \
              --search "$title in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
            if [ -z "$number" ]; then
              body="$(sed -e "s|{{VERSION}}|$version|g" -e "s|{{REPOSITORY}}|$GITHUB_REPOSITORY|g" "$ISSUE_TEMPLATE")"
              number="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                --label "$ISSUE_LABEL" --body "$body" | grep -oE '[0-9]+$')"
            fi
            jq --arg v "$version" --argjson n "$number" \
              '.versions += [{version: $v, status: "planned", tracking_issue: $n}]
               | .versions |= sort_by(.version | split(".") | map(tonumber))' \
              "$MANIFEST" > "$MANIFEST.tmp" && mv "$MANIFEST.tmp" "$MANIFEST"
            summary+="- OpenAPI v$version — #$number"$'\n'
          done

          { echo "summary<<EOF"; echo "$summary"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Regenerate support matrix
        if: steps.find.outputs.versions != ''
        run: make update-versions

      - name: Open pull request
        if: steps.find.outputs.versions != ''
        uses: alchemaxinc/composite-toolbox/create-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: develop
          branch-prefix: detect-openapi
          files: ${{ env.MANIFEST }} README.md
          commit-message: "chore(openapi): track newly released OpenAPI versions"
          pr-title: "chore(openapi): track newly released OpenAPI versions"
          pr-body: ${{ steps.issues.outputs.summary }}
