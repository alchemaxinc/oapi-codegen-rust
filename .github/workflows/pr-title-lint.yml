name: PR

# Lints the PR title against Conventional Commits.
#
# Kept in its own workflow (separate from ci.yml) so title edits re-trigger
# only this ~10-second check rather than the entire CI matrix. The default
# `pull_request` trigger types (opened, synchronize, reopened) do NOT fire
# on title edits — `edited` is required.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  COMMITLINT_CLI_VERSION: "20.5.0"

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (shallow)
        uses: actions/checkout@v7

      - name: Cache Commitlint
        id: cache-commitlint
        uses: actions/cache@v6
        with:
          path: node_modules
          key: v1-commitlint-${{ env.COMMITLINT_CLI_VERSION }}

      - name: Install Commitlint
        if: steps.cache-commitlint.outputs.cache-hit != 'true'
        run: npm i -D @commitlint/cli@${{ env.COMMITLINT_CLI_VERSION }} @commitlint/config-conventional @commitlint/types

      - name: Lint PR title (conventional commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose
