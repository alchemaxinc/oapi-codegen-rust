name: Semantic Versioning and Release

on:
  push:
    branches:
      # main -> full stable releases (+ crates.io); develop -> `-dev.N`
      # prereleases via the semantic-release prerelease channel in .releaserc.json.
      - main
      - develop
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  issues: write
  contents: write
  id-token: write
  pull-requests: write

env:
  # Pin cargo-edit so the version bump is reproducible; bump this to adopt a
  # newer release. Used by the build and publish jobs to stamp the tag version
  # into Cargo.toml before building/publishing.
  CARGO_EDIT_VERSION: "0.13.13"

jobs:
  semantic-release:
    name: Semantic Versioning and Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version-release.outputs.tag }}

    steps:
      - &create-app-token
        name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Checkout and setup
        uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
        with:
          shallow: false
          token: ${{ steps.app.outputs.token }}

      - name: Version and release
        id: version-release
        uses: alchemaxinc/composite-toolbox/semantic-release@v1
        with:
          token: ${{ steps.app.outputs.token }}

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: semantic-release
    if: needs.semantic-release.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    env:
      # Force ANSI color in cargo/rustc output so GitHub Actions renders
      # release-build logs in color.
      CARGO_TERM_COLOR: always
      # Incremental compilation is a net loss in CI: tiny files bloat
      # the cache while CI never reuses incremental state across runs.
      CARGO_INCREMENTAL: "0"
      # Retry transient registry / network failures up to 10 times before
      # failing the release build (default is 3).
      CARGO_NET_RETRY: "10"
      # Same retry-budget rationale but for `rustup` itself, invoked
      # indirectly by dtolnay/rust-toolchain.
      RUSTUP_MAX_RETRIES: "10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # semantic-release tags the released commit; check it out so we build
          # from the released sources, then stamp the tag version into the
          # workspace manifests below (set-version keeps Cargo.lock consistent,
          # so the build still runs --locked).
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          key: ${{ matrix.target }}

      - name: Cache cargo-edit
        id: cache-cargo-edit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-set-version
          key: cargo-edit-${{ runner.os }}-${{ env.CARGO_EDIT_VERSION }}

      - name: Install cargo-edit
        if: steps.cache-cargo-edit.outputs.cache-hit != 'true'
        run: cargo install cargo-edit --locked --version "${CARGO_EDIT_VERSION}" --bin cargo-set-version

      - name: Stamp the released version into Cargo.toml
        # The tag is authoritative; write its version into the workspace so the
        # built binary reports it via CARGO_PKG_VERSION.
        env:
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: cargo set-version --workspace "${TAG#v}"

      - name: Build binary
        run: cargo build --release --locked -p oapi-codegen --bin oapi-codegen --target ${{ matrix.target }}

      - name: Rename binary and generate checksum
        run: |
          cd target/${{ matrix.target }}/release
          mv oapi-codegen oapi-codegen-${{ matrix.target }}
          # macOS runners ship `shasum` rather than GNU `sha256sum`.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum oapi-codegen-${{ matrix.target }} > oapi-codegen-${{ matrix.target }}.sha256
          else
            shasum -a 256 oapi-codegen-${{ matrix.target }} > oapi-codegen-${{ matrix.target }}.sha256
          fi

      - *create-app-token

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "target/${{ matrix.target }}/release/oapi-codegen-${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/oapi-codegen-${{ matrix.target }}.sha256" \
            --clobber

  publish:
    name: Publish release
    needs: [semantic-release, build-and-upload]
    runs-on: ubuntu-latest

    steps:
      - *create-app-token

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  publish-crate:
    name: Publish to crates.io
    needs: [semantic-release, publish]
    # crates.io is immutable and prereleases live on develop, so only the stable
    # main channel publishes. develop `-dev.N` builds never reach crates.io.
    if: >-
      needs.semantic-release.outputs.tag != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo-edit
        id: cache-cargo-edit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-set-version
          key: cargo-edit-${{ runner.os }}-${{ env.CARGO_EDIT_VERSION }}

      - name: Install cargo-edit
        if: steps.cache-cargo-edit.outputs.cache-hit != 'true'
        run: cargo install cargo-edit --locked --version "${CARGO_EDIT_VERSION}" --bin cargo-set-version

      - name: Stamp the released version into Cargo.toml
        # The tag is authoritative for the version. Stamp it into the manifests
        # and make an ephemeral local commit (never pushed) so `cargo publish`
        # sees a clean tree and we avoid `--allow-dirty` — which would otherwise
        # silently bundle any unrelated dirty file. Committing only these two
        # paths keeps cargo's own dirty check as a guard against that.
        env:
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          cargo set-version --workspace "${TAG#v}"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(release): ${TAG#v}" -- Cargo.toml Cargo.lock

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "oapi-codegen") | .version')

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: oapi-codegen release pipeline (github.com/alchemaxinc/oapi-codegen-rust)' \
            "https://crates.io/api/v1/crates/oapi-codegen/${version}")

          if [ "$status" = "200" ]; then
            echo "oapi-codegen ${version} is already on crates.io; skipping publish."
            exit 0
          fi

          echo "Publishing oapi-codegen ${version} to crates.io."
          cargo publish -p oapi-codegen --locked

  backmerge:
    name: Backmerge main into develop
    # Runs as its own job so a backmerge conflict cannot block the release
    # itself — by the time we get here the tag, GitHub release and crates.io
    # publish have already succeeded. Merges main into develop so the next
    # prerelease builds on the release rather than diverging from it.
    needs: [semantic-release, publish, publish-crate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - *create-app-token

      - name: Checkout and setup
        uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
        with:
          shallow: false
          token: ${{ steps.app.outputs.token }}

      - name: Backmerge main into develop
        run: |
          set -e
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge main --no-edit
          git push origin develop
