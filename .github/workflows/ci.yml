name: CI

on:
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  # Pinned Prettier version — kept in env so the install + cache key stay in
  # sync. Bump together with any prettier-config changes.
  PRETTIER_VERSION: "3.9.5"

  # Pinned linker / test-runner versions for the manual installs below.
  # Pinning avoids surprise breakage from upstream releases and lets the
  # Swatinem cache stay valid (RUSTFLAGS is part of the cache key).
  MOLD_VERSION: "2.41.0"
  NEXTEST_VERSION: "0.9.133"
  CARGO_DENY_VERSION: "0.20.2"

  # Force ANSI colour in cargo/rustc output so GitHub Actions renders the
  # terminal output in colour rather than as a wall of plain text.
  CARGO_TERM_COLOR: always

  # Incremental compilation is a net loss in CI: it produces a lot of small
  # `target/incremental/*` files that bloat the cache and slow down both the
  # save and restore steps, while CI never benefits from the cross-run reuse
  # incremental was designed for (each run starts from a restored cache, not
  # from a previous incremental state).
  CARGO_INCREMENTAL: "0"

  # Retry transient crates.io / docker.io / GitHub fetch failures up to 10
  # times before failing the build, instead of the default 3. CI networking
  # is flaky often enough that this avoids spurious red runs.
  CARGO_NET_RETRY: "10"

  # Sparse registry protocol is already Cargo's default on 1.70+, but pinning
  # it explicitly keeps the cache key deterministic if Cargo ever flips the
  # default back and avoids the much slower git-based index protocol.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

  # Strip full DWARF debuginfo from dev and test builds. keep just enough
  # (line tables) for panic backtraces to show the failing line. Saves
  # roughly 20-30% on compile + link time and shrinks `target/` substantially,
  # which in turn makes the rust-cache save/restore much faster. We don't
  # debug binaries on CI, so the lost detail is irrelevant here.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

  # Same retry-budget rationale as CARGO_NET_RETRY but for `rustup` itself,
  # which is invoked indirectly by dtolnay/rust-toolchain.
  RUSTUP_MAX_RETRIES: "10"

  # `short` backtraces keep test/clippy failure logs scannable: full
  # backtraces include every libcore frame and dominate the failure output.
  RUST_BACKTRACE: short

jobs:
  install-prettier:
    runs-on: ubuntu-latest
    steps:
      - &checkout-code
        name: Checkout code (shallow)
        uses: actions/checkout@v7

      - &cache-prettier
        name: Cache Prettier
        id: cache-prettier
        uses: actions/cache@v6
        with:
          path: node_modules
          key: v1-prettier-${{ env.PRETTIER_VERSION }}

      - name: Install Prettier
        if: steps.cache-prettier.outputs.cache-hit != 'true'
        run: npm i -D prettier@${{ env.PRETTIER_VERSION }}

  rust-checks:
    name: rust-checks
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      # mold is a drop-in linker that links Rust binaries roughly an order of
      # magnitude faster than ld. It is a significant win for a workspace with three
      # binaries that all link openssl/rusqlite/and more. Install it manually into
      # ~/.local/mold (rather than /usr/local) so the install tree can be
      # cached as a single directory keyed on MOLD_VERSION — same pattern as
      # the Prettier cache above.
      - &cache-mold
        name: Cache mold linker
        id: cache-mold
        uses: actions/cache@v6
        with:
          path: ~/.local/mold
          key: v1-mold-${{ env.MOLD_VERSION }}-x86_64-linux

      - &install-mold
        name: Install mold linker
        env:
          # Tells rustc to use mold instead of the default linker. Picked up
          # by Swatinem/rust-cache as part of the cache key, so swapping
          # linkers will correctly invalidate the cargo cache.
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/mold/bin/mold" ]; then
            mkdir -p "$HOME/.local/mold"
            curl -fsSL "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz" \
              | tar -xz -C "$HOME/.local/mold" --strip-components=1
          fi
          echo "$HOME/.local/mold/bin" >> "$GITHUB_PATH"
          "$HOME/.local/mold/bin/mold" --version
          echo "RUSTFLAGS=${RUSTFLAGS}" >> "$GITHUB_ENV"

      # Swatinem/rust-cache is purpose-built for cargo: it scopes the cache to
      # `target/` artifacts that survived the run, prunes stale rlibs, keys on
      # Cargo.lock + rustc version automatically, and only saves on changes —
      # all things the raw actions/cache wrapping above did poorly.
      - &cache-cargo
        name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          # Keep target/ pruned so cache stays small and restore stays fast.
          cache-targets: "true"
          cache-all-crates: "true"

      # cargo-nextest is shipped as a single static binary from
      # get.nexte.st. We cache the resolved binary by version so subsequent
      # CI runs skip the download entirely (~2s saved per run, but more
      # importantly removes a network dependency from the hot path).
      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: v1-cargo-nextest-${{ env.NEXTEST_VERSION }}-x86_64-linux

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://get.nexte.st/${NEXTEST_VERSION}/linux" \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Verify cargo-nextest
        run: cargo nextest --version

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      # Fail on broken or private intra-doc links so doc comments can't rot.
      - name: Check rustdoc links
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links"
        run: cargo doc --no-deps --workspace --locked

      - name: Run unit tests
        if: ${{ !startsWith(github.event.pull_request.title, 'chore:') && !startsWith(github.event.pull_request.title, 'chore(') && !startsWith(github.event.pull_request.title, 'docs:') && !startsWith(github.event.pull_request.title, 'docs(') }}
        # nextest is faster than `cargo test` (parallel process model, smarter
        # scheduling) and reuses the artifacts clippy just produced because
        # both invocations target the same `target/` directory.
        run: cargo nextest run --workspace --all-targets --locked --no-fail-fast

      # Regenerate the committed example + fixtures and fail on any diff, so a
      # change to the generator or a spec cannot land without its regenerated
      # output. Runs unconditionally (no chore: skip) because drift is cheap to
      # check and must never slip through. Reuses the target/ built above.
      - name: Check generated code is up to date
        run: make verify-generated

  # The generator reports a Rust version to every consumer after a write, as the
  # version needed to compile the emitted code. This job compiles every committed
  # generated file on exactly that toolchain, so the reported number is measured
  # rather than claimed.
  #
  # The floor is set by the crates the output depends on, and not by the syntax the
  # emitters produce, so it moves on a dependency bump and not on a generator
  # change. That makes it exactly the kind of claim that rots without a check. See
  # docs/msrv.md.
  #
  # This job does not use ./.github/actions/setup-rust: that action installs the
  # pinned build toolchain, which is much newer than this floor and would defeat
  # the measurement. `make verify-msrv` installs the right one from the manifest.
  generated-code-msrv:
    name: generated-code-msrv
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      # Keyed separately from rust-checks because this job builds a different crate
      # on a different toolchain. Sharing the key would thrash both caches.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: generated-code-msrv
          cache-targets: "true"
          cache-all-crates: "true"
          workspaces: crates/oapi-codegen/tests/msrv-check

      - name: Compile generated code on the consumer Rust floor
        run: make verify-msrv

  lint-prettier:
    runs-on: ubuntu-latest
    needs: install-prettier
    steps:
      - *checkout-code
      - *cache-prettier

      - name: Run Prettier
        run: npx prettier --check .

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - *checkout-code

      # Needed because cargo-deny shells out to `cargo metadata`.
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      # Self-install + cache the pinned binary, same pattern as mold/nextest.
      # Policy lives in deny.toml. Key hardcodes musl since this job is x86_64
      # ubuntu-latest. revisit the key and URL together if that changes.
      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@v6
        with:
          path: ~/.local/cargo-deny
          key: v1-cargo-deny-${{ env.CARGO_DENY_VERSION }}-x86_64-linux-musl

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/cargo-deny"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/cargo-deny" --strip-components=1

      - name: Verify cargo-deny
        run: |
          echo "$HOME/.local/cargo-deny" >> "$GITHUB_PATH"
          "$HOME/.local/cargo-deny/cargo-deny" --version

      - name: Check advisories, bans, licenses and sources
        run: "$HOME/.local/cargo-deny/cargo-deny --locked check --hide-inclusion-graph"

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [rust-checks, generated-code-msrv, lint-prettier, cargo-deny]
    steps:
      - name: Verify all jobs passed or were skipped
        run: |
          results=(
            "${{ needs.rust-checks.result }}"
            "${{ needs.generated-code-msrv.result }}"
            "${{ needs.lint-prettier.result }}"
            "${{ needs.cargo-deny.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
