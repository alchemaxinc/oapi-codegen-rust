name: Check OpenAPI Versions
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # Run on the 1st of every month at midnight

# Probes the upstream OpenAPI specification releases and subtracts the versions
# we already support in .github/openapi-versions.json. For every released minor
# version we do not support it opens a tracking issue (asking Copilot for a deep
# dive) and adds a "Planned" row to the README support matrix. Working from an
# explicit supported set (rather than a single high-water mark) means gaps are
# handled: supporting 3.2 before 3.1 still leaves 3.1 tracked. Both actions are
# idempotent, so reruns never create duplicates.

env:
  BASE_BRANCH: develop
  PR_TITLE: "docs: track newly released OpenAPI specification versions"
  # Kept in sync with ci.yml so the row we insert is formatted by the same
  # Prettier version that CI later checks against.
  PRETTIER_VERSION: "3.9.5"

jobs:
  check-openapi-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}

      - name: Checkout and setup
        uses: alchemaxinc/composite-toolbox/checkout-and-setup@v1
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ env.BASE_BRANCH }}

      - name: Detect unsupported OpenAPI versions
        id: detect
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Minor versions we already support, and our lowest supported version
          # (the floor below which upstream releases are intentionally ignored).
          # sort -V keeps double-digit minors (e.g. 3.10) ordered correctly.
          supported=$(jq -r '.supported[]' .github/openapi-versions.json | sort -V -u)
          if [ -z "$supported" ]; then
            echo "::error::.github/openapi-versions.json must list at least one supported minor version under .supported"
            exit 1
          fi
          floor=$(printf '%s\n' "$supported" | head -n1)

          # Minor versions upstream has released (stable only).
          released=$(gh api repos/OAI/OpenAPI-Specification/releases --paginate \
            --jq '.[] | select(.prerelease == false) | .tag_name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk -F. '{ print $1 "." $2 }' | sort -V -u)

          # Unsupported = released minus supported, restricted to >= floor. The
          # set difference is computed in awk (not comm) so it does not depend on
          # the inputs sharing a byte-wise sort order.
          new=$(awk -F. -v floor="$floor" \
            'BEGIN { split(floor, f, ".") }
             FNR == NR { supported[$0] = 1; next }
             ($0 in supported) { next }
             ($1 + 0 > f[1] + 0) || ($1 + 0 == f[1] + 0 && $2 + 0 >= f[2] + 0)' \
            <(printf '%s\n' "$supported") <(printf '%s\n' "$released"))

          {
            echo "new<<EOF"
            echo "$new"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Supported OpenAPI versions: $(echo "$supported" | tr '\n' ' ')"
          echo "::notice::Unsupported OpenAPI versions: $(echo "$new" | tr '\n' ' ')"

      - name: File tracking issues and update support matrix
        if: steps.detect.outputs.new != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEW_VERSIONS: ${{ steps.detect.outputs.new }}
        run: |
          for minor in $NEW_VERSIONS; do
            title="Support OpenAPI $minor"

            url=$(gh issue list --state all --search "$title in:title" \
              --json title,url --jq "[.[] | select(.title == \"$title\")][0].url // empty")

            if [ -z "$url" ]; then
              url=$(gh issue create --title "$title" --label enhancement --type Feature \
                --body "$(printf '%s\n' \
                  "@copilot" \
                  "" \
                  "OpenAPI **$minor** has been released upstream (see the [OpenAPI Specification releases](https://github.com/OAI/OpenAPI-Specification/releases)), but is not yet supported by \`oapi-codegen-rust\`." \
                  "" \
                  "Please do a thorough deep dive into what it would take to support OpenAPI $minor here:" \
                  "" \
                  "- Summarise the notable specification changes in OpenAPI $minor relative to the versions we already support." \
                  "- Identify the concrete parts of the implementation (loader, lowering, IR, emitters, config, tests) that would need to change." \
                  "- Call out the biggest challenges, ambiguities, and design decisions to be made." \
                  "- Propose a rough, staged plan of action to reach parity, in line with how previous versions were added." \
                  "" \
                  "_Filed automatically by the OpenAPI version check workflow._")")
              echo "::notice::Opened tracking issue for OpenAPI $minor: $url"
            else
              echo "::notice::Reusing existing tracking issue for OpenAPI $minor: $url"
            fi

            # Append an unformatted row; the next step runs Prettier to align it.
            if ! grep -Fq "| v${minor}.0 " README.md; then
              row="| v${minor}.0 | Planned | Tracking [here]($url). |"
              awk -v row="$row" \
                '/^\| v[0-9]+\./ { last = NR } { lines[NR] = $0 }
                 END { for (i = 1; i <= NR; i++) { print lines[i]; if (i == last) print row } }' \
                README.md > README.md.tmp
              mv README.md.tmp README.md
            fi
          done

      - name: Format support matrix
        if: steps.detect.outputs.new != ''
        run: npx --yes prettier@${{ env.PRETTIER_VERSION }} --write README.md

      - name: Check for changes
        id: changes
        uses: alchemaxinc/composite-toolbox/check-changes@v1
        with:
          files: README.md

      - name: Check for existing pull request
        id: existing
        if: steps.changes.outputs.has_changes == 'true'
        uses: alchemaxinc/update-deps/shared/actions/check-existing-pr@v2
        with:
          token: ${{ steps.app.outputs.token }}
          pr-title: ${{ env.PR_TITLE }}
          base-branch: ${{ env.BASE_BRANCH }}

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true' && steps.existing.outputs.exists != 'true'
        uses: alchemaxinc/composite-toolbox/create-pr@v1
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: ${{ env.BASE_BRANCH }}
          branch-prefix: openapi-version-tracking
          files: README.md
          commit-message: ${{ env.PR_TITLE }}
          pr-title: ${{ env.PR_TITLE }}
          pr-body: "Automated update: new OpenAPI specification versions were detected upstream. This PR adds them to the support matrix; tracking issues have been filed for each."
