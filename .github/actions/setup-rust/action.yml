name: Setup Rust toolchain
description: >-
  Reads the pinned toolchain channel from rust-toolchain.toml and installs it
  via dtolnay/rust-toolchain, so the channel is single-sourced across CI and
  the release pipeline instead of being duplicated in every workflow.

inputs:
  components:
    description: Comma-separated list of extra rustup components to install (e.g. "clippy, rustfmt").
    required: false
    default: ""
  targets:
    description: Comma-separated list of extra compilation targets to install.
    required: false
    default: ""

outputs:
  version:
    description: The Rust toolchain channel read from rust-toolchain.toml.
    value: ${{ steps.rust-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read Rust toolchain version
      id: rust-version
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n1)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v-nobody-knows until https://github.com/dtolnay/rust-toolchain/issues/180 is fixed
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
        toolchain: ${{ steps.rust-version.outputs.version }}
