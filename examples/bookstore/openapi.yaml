openapi: "3.0.3"
info:
  title: Bookstore API
  description: >-
    A small, multi-file OpenAPI spec used to demonstrate generating an idiomatic
    Rust project with oapi-codegen-rust: per-schema model modules plus an axum
    server whose cross-file `$ref`s resolve through `import-mapping`.
  version: "1.0.0"
components:
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "schemas/common.yaml#/components/schemas/ErrorResponse"
    NotFound:
      description: No resource matched the request.
paths:
  /books:
    get:
      operationId: listBooks
      summary: List books, optionally filtered.
      parameters:
        - name: author
          in: query
          required: false
          description: Restrict the listing to a single author.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Only return books carrying every given tag.
          schema:
            type: array
            items:
              type: string
        - $ref: "schemas/common.yaml#/components/parameters/Limit"
      responses:
        "200":
          description: The matching books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "schemas/catalog.yaml#/components/schemas/Book"
    post:
      operationId: createBook
      summary: Add a book to the catalog.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key so a retried create is not duplicated.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "schemas/catalog.yaml#/components/schemas/NewBook"
      responses:
        "201":
          description: The book was created.
          content:
            application/json:
              schema:
                $ref: "schemas/catalog.yaml#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "schemas/common.yaml#/components/responses/Unauthorized"
  /books/{id}:
    get:
      operationId: getBook
      summary: Fetch a single book by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested book.
          content:
            application/json:
              schema:
                $ref: "schemas/catalog.yaml#/components/schemas/Book"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          description: An unexpected error; the handler sets the status code.
          content:
            application/json:
              schema:
                $ref: "schemas/common.yaml#/components/schemas/ErrorResponse"
  /books/{id}/cover:
    put:
      operationId: uploadBookCover
      summary: Upload or replace a book's cover image.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: >-
                A book-cover image upload. Declared inline so the generator
                emits a dedicated `UploadBookCoverMultipart` extractor without a
                redundant named component.
              required:
                - image
                - filename
              properties:
                image:
                  type: string
                  format: binary
                  description: The raw cover-image bytes.
                filename:
                  type: string
                  description: Original filename of the uploaded image.
                caption:
                  type: string
                  description: Optional human-readable caption for the cover.
      responses:
        "204":
          description: The cover image was stored.
        "404":
          $ref: "#/components/responses/NotFound"
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe returning a free-form document.
      responses:
        "200":
          description: An opaque service-health document.
          content:
            application/json:
              schema: {}
