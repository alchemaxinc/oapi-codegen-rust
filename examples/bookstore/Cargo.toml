[package]
name = "bookstore-example"
description = "Composed example: oapi-codegen-rust generating models + an axum server from a multi-file OpenAPI spec"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
