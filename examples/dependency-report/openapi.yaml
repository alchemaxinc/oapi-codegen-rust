openapi: "3.0.3"
info:
  title: Widgets
  version: "1.0.0"
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets, optionally limited.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of widgets to return.
          schema:
            type: integer
      responses:
        "200":
          description: The matching widgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
components:
  schemas:
    Widget:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
